<!DOCTYPE html>
<html>
<head>
    <title>HTML Image Tag Example</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
        }

        header {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 80%;
            margin: 30px auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
            text-align: center;
        }

        img {
            border-radius: 10px;
            margin: 15px;
            box-shadow: 0px 0px 8px gray;
            transition: 0.3s;
        }

        img:hover {
            transform: scale(1.05);
        }

        footer {
            text-align: center;
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            margin-top: 20px;
        }

    </style>

</head>

<body>

<header>
    <h1>HTML Image Tag Demonstration</h1>
    <p>Example of adding images in a webpage</p>
</header>

<div class="container">

    <h2>Example 1: Nature Image</h2>

    <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600"
         width="300"
         height="200"
         alt="Nature Image">

    <h2>Example 2: Beach Image</h2>

    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600"
         width="300"
         height="200"
         alt="Beach Image">

    <h2>Example 3: Mountain Image with Title</h2>

    <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600"
         width="300"
         height="200"
         alt="Mountain Image"
         title="Beautiful Mountain View">

</div>

<footer>
    <p>Created by: Shreyash Kamble | HTML Practical Assignment</p>
</footer>

</body>
</html>
